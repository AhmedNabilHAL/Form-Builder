spring.application.name=form-builder-api

server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/form_builder}

logging.level.root=INFO
logging.level.com.aiagentictask.form_builder_api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=false
app.cors.max-age=3600

app.security.enable-hsts=false
app.security.content-security-policy=default-src 'self'
app.security.referrer-policy=strict-origin-when-cross-origin

# Gemini form generation. Secrets come from the environment only.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.temperature=0.2
app.gemini.max-output-tokens=2048
# thinking-budget=0 disables model "thinking" to conserve free-tier tokens.
app.gemini.thinking-budget=0
app.gemini.timeout-ms=30000
# Validation-feedback retry loop (kept low to protect the free tier).
app.gemini.retry.max-attempts=2
# Transient HTTP retries handled by the SDK.
app.gemini.retry.http-attempts=2
app.gemini.retry.http-status-codes=408,429,500,503

# Chat agent (ReAct). Reuses the Gemini client; keeps context small to save tokens.
app.agent.model=${GEMINI_MODEL:gemini-2.5-flash}
app.agent.temperature=0.3
app.agent.max-output-tokens=1024
app.agent.thinking-budget=0
# Reason/act loop cap.
app.agent.max-tool-iterations=5
# Summarize older turns once stored history passes this many characters.
app.agent.history-char-threshold=4000
# Recent turns kept verbatim after summarization.
app.agent.recent-messages-to-keep=6
app.agent.summary-max-tokens=512
app.agent.max-user-message-length=4000
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI}

logging.level.root=INFO
logging.level.com.aiagentictask.form_builder_api=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Persistent submission file storage (Google Cloud Storage).
# GCS_BUCKET_NAME is required. GOOGLE_CREDENTIALS_JSON is optional: leave it unset
# to use the Cloud Run service account via Application Default Credentials.
app.storage.bucket-name=${GCS_BUCKET_NAME}
app.storage.credentials-json=${GOOGLE_CREDENTIALS_JSON:}

app.security.enable-hsts=true
app.security.content-security-policy=default-src 'self'; frame-ancestors 'none'
app.security.referrer-policy=strict-origin-when-cross-origin

app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}